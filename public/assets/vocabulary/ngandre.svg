<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardGlow_ngandre" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FDFBF7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Latar Belakang Krem Kertas Lontar -->
  <rect width="240" height="200" rx="16" fill="#FDFBF7" />
  <rect width="240" height="200" rx="16" fill="url(#cardGlow_ngandre)" />
  <rect x="1" y="1" width="238" height="198" rx="15" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Badge Kategori Mini Atas -->
  <rect x="20" y="12" width="100" height="18" rx="9" fill="#D4AF37" fill-opacity="0.12" />
  <text x="70" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#111827" text-anchor="middle">Kegiatan Harian</text>

  <!-- Ikon Karakter Visual 3D -->
  <text x="120" y="95" font-size="54" text-anchor="middle" dominant-baseline="central">🍲</text>

  <!-- Simbol Aksara Lontara di Tengah -->
  <text x="120" y="145" font-family="'Noto Sans Buginese', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#1B2A4A" text-anchor="middle">ᨂᨓᨙ</text>

  <!-- Deskripsi Arti -->
  <text x="120" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle">Makan (Coto Makassar)</text>
</svg>