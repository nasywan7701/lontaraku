<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="palaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F2F4F7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#4A2508" />
    </linearGradient>
    <linearGradient id="roofGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="130" fill="url(#palaceGlow)" />
  <circle cx="200" cy="150" r="110" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Tiang-Tiang Kayu Penyangga Istana Balla Lompoa -->
  <line x1="120" y1="180" x2="120" y2="260" stroke="url(#woodGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="160" y1="180" x2="160" y2="260" stroke="url(#woodGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="180" x2="200" y2="260" stroke="url(#woodGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="240" y1="180" x2="240" y2="260" stroke="url(#woodGrad)" stroke-width="8" stroke-linecap="round" />
  <line x1="280" y1="180" x2="280" y2="260" stroke="url(#woodGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Lantai Panggung Kayu Jati -->
  <rect x="100" y="175" width="200" height="15" rx="4" fill="url(#woodGrad)" />

  <!-- Badan Rumah Kayu & Jendela Berukir -->
  <rect x="110" y="120" width="180" height="60" fill="#5C2E0B" />
  <rect x="135" y="135" width="25" height="30" rx="3" fill="#FFD700" opacity="0.85" />
  <rect x="187" y="135" width="25" height="30" rx="3" fill="#FFD700" opacity="0.85" />
  <rect x="240" y="135" width="25" height="30" rx="3" fill="#FFD700" opacity="0.85" />

  <!-- Atap Bersusun Khas Balla Lompoa (Timpa Laja Bertingkat) -->
  <polygon points="200,45 80,125 320,125" fill="#C8102E" />
  <polygon points="200,60 100,125 300,125" fill="#7A0012" />
  
  <!-- Lis Trim Emas Atap Timpa Laja -->
  <line x1="80" y1="125" x2="320" y2="125" stroke="url(#roofGold)" stroke-width="4" stroke-linecap="round" />
  <polygon points="200,38 206,46 194,46" fill="#FFD700" />

  <!-- Tangga Depan Khas Istana Gowa -->
  <polygon points="185,188 215,188 225,260 175,260" fill="url(#woodGrad)" />
  <line x1="183" y1="205" x2="217" y2="205" stroke="#FFD700" stroke-width="2" />
  <line x1="180" y1="222" x2="220" y2="222" stroke="#FFD700" stroke-width="2" />
  <line x1="177" y1="240" x2="223" y2="240" stroke="#FFD700" stroke-width="2" />

  <!-- Teks Lontara & Nama -->
  <text x="200" y="290" font-family="'Noto Sans Buginese', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#1B2A4A" text-anchor="middle">ᨅᨒ ᨒᨚᨄᨚ (Balla Lompoa Gowa)</text>
</svg>

